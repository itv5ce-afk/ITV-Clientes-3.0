<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINHAS COMPRAS 1.0</title>
    <style>
        :root {
            --azul: #2196F3;
            --lilas: #9c27b0;
            --vermelho: #f44336;
            --verde: #4CAF50;
            --laranja: #ff9800;
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
        }

        .container { padding: 15px; max-width: 500px; margin: auto; position: relative; }

        h1 { text-align: center; font-size: 1.5rem; color: #00d2ff; margin-top: 40px; }

        /* Botão Calculadora Superior Direito */
        .btn-calc-topo {
            position: absolute;
            top: 10px;
            right: 15px;
            background: var(--laranja);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }

        /* Modal da Calculadora */
        #calc-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);            background: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 2000;
            width: 260px;
        }

        #calc-display {
            width: 100%;
            height: 50px;
            background: #000;
            color: #0f0;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            margin-bottom: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            border: 1px solid #444;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-calc {
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        .btn-calc.op { background: var(--laranja); }
        .btn-calc.igual { background: var(--verde); grid-column: span 2; }
        .btn-calc.clear { background: var(--vermelho); grid-column: span 2; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1999;
        }
        /* Menu Superior */        .menu-topo {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 20px;
        }

        .btn-small {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Cores dos Botões */
        .bg-azul { background-color: var(--azul); }
        .bg-verde { background-color: var(--verde); }
        .bg-vermelho { background-color: var(--vermelho); }
        .bg-lilas { background-color: var(--lilas); }
        .bg-laranja { background-color: var(--laranja); }

        /* Card de Alimentação */
        .card-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Formulário */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .input-row {
            display: flex;
            gap: 5px;
        }        input, select {
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: #eee;
            color: #333;
        }

        /* Lista de Compras */
        .item-compra {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            position: relative;
        }

        .item-compra.pago { border-left: 8px solid var(--verde); }
        .item-compra.pendente { border-left: 8px solid var(--vermelho); }

        /* Indicador de sincronização */
        .sync-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            z-index: 100;
        }
        .sync-ok { background: var(--verde); }
        .sync-error { background: var(--vermelho); }
        .sync-pending { background: var(--laranja); }

        /* === ESTILOS DO LOGIN === */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            text-align: center;
            color: #00d2ff;
            margin: 0 0 20px 0;
            font-size: 1.4rem;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .login-input::placeholder { color: #666; }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin: 15px 0 10px 0;
            border: none;
            border-radius: 8px;
            background: var(--azul);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover { background: #1976d2; }

        .login-toggle {
            text-align: center;
            margin-top: 15px;            font-size: 0.9rem;
            color: #ccc;
        }

        .login-toggle a {
            color: #00d2ff;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        .login-toggle a:hover { text-decoration: underline; }

        .login-error {
            background: rgba(244, 67, 54, 0.2);
            color: #ffcdd2;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .user-info {
            position: absolute;
            top: 10px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            z-index: 10;
        }

        .btn-logout {
            background: var(--vermelho);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- === TELA DE LOGIN === -->
<div id="login-screen">
    <div class="login-card">
        <h2>🔐 MINHAS COMPRAS 1.0</h2>
        
        <div id="login-error" class="login-error"></div>
        
        <!-- Formulário de Login -->
        <div id="form-login">
            <input type="email" id="login-email" class="login-input" placeholder="📧 Seu e-mail" required>
            <input type="password" id="login-senha" class="login-input" placeholder="🔒 Sua senha" required>
            <button onclick="fazerLogin()" class="login-btn" id="btn-login">
                ENTRAR
            </button>
            <div class="login-toggle">
                Não tem conta? <a onclick="alternarCadastro()">Criar conta</a>
            </div>
        </div>
        
        <!-- Formulário de Cadastro -->
        <div id="form-cadastro" class="hidden">
            <input type="text" id="cad-nome" class="login-input" placeholder="👤 Seu nome" required>
            <input type="email" id="cad-email" class="login-input" placeholder="📧 Seu e-mail" required>
            <input type="password" id="cad-senha" class="login-input" placeholder="🔒 Crie uma senha (mín. 6 caracteres)" required minlength="6">
            <input type="password" id="cad-confirmar" class="login-input" placeholder="🔐 Confirmar senha" required>
            <button onclick="criarConta()" class="login-btn bg-verde" id="btn-cadastro">
                CRIAR CONTA
            </button>
            <div class="login-toggle">
                Já tem conta? <a onclick="alternarCadastro()">Fazer login</a>
            </div>
        </div>
    </div></div>

<div class="overlay" id="overlay" onclick="toggleCalc()"></div>
<div id="calc-modal">
    <div id="calc-display">0</div>
    <div class="calc-grid">
        <button class="btn-calc clear" onclick="clearCalc()">C</button>
        <button class="btn-calc op" onclick="addCalc('/')">/</button>
        <button class="btn-calc op" onclick="addCalc('*')">x</button>
        <button class="btn-calc" onclick="addCalc('7')">7</button>
        <button class="btn-calc" onclick="addCalc('8')">8</button>
        <button class="btn-calc" onclick="addCalc('9')">9</button>
        <button class="btn-calc op" onclick="addCalc('-')">-</button>
        <button class="btn-calc" onclick="addCalc('4')">4</button>
        <button class="btn-calc" onclick="addCalc('5')">5</button>
        <button class="btn-calc" onclick="addCalc('6')">6</button>
        <button class="btn-calc op" onclick="addCalc('+')">+</button>
        <button class="btn-calc" onclick="addCalc('1')">1</button>
        <button class="btn-calc" onclick="addCalc('2')">2</button>
        <button class="btn-calc" onclick="addCalc('3')">3</button>
        <button class="btn-calc" onclick="addCalc('.')">.</button>
        <button class="btn-calc" onclick="addCalc('0')">0</button>
        <button class="btn-calc igual" onclick="execCalc()">=</button>
    </div>
</div>

<div class="container" id="app-content" style="display: none;">
    <!-- Info do usuário logado -->
    <div class="user-info">
        <span id="user-display">👤 Usuário</span>
        <button onclick="fazerLogout()" class="btn-logout">SAIR</button>
    </div>
    
    <button class="btn-calc-topo" onclick="toggleCalc()">🖩 CALCULADORA</button>
    <h1>MINHAS COMPRAS 1.0</h1>

    <div class="card-info">
        <label>Saldo Alimentação (Mês):</label>
        <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px;">
            <input type="number" id="saldo-alim" placeholder="R$ 0,00" style="flex:1; min-width: 100px;">
            <button onclick="salvarAlimentacao()" id="btn-fixar" class="btn-small bg-verde">FIXAR ALIMENTAÇÃO</button>
            <button onclick="editarAlimentacao()" id="btn-editar-alim" class="btn-small bg-laranja" style="display:none">EDITAR</button>
        </div>
        <p>Saldo Atual: <strong id="display-saldo">R$ 0,00</strong></p>
    </div>

    <div class="menu-topo">
        <button class="btn-small bg-azul" onclick="showTab('cad')">+ COMPRA</button>
        <button class="btn-small bg-verde" onclick="showTab('pago')">PAGO</button>
        <button class="btn-small bg-vermelho" onclick="showTab('n-pago')">NÃO PAGO</button>        <select id="filtro-mes" onchange="renderList()" class="btn-small" style="background: #333; color: white;">
            <option value="01">JAN</option><option value="02">FEV</option>
            <option value="03">MAR</option><option value="04">ABR</option>
            <option value="05">MAI</option><option value="06">JUN</option>
            <option value="07">JUL</option><option value="08">AGO</option>
            <option value="09">SET</option><option value="10">OUT</option>
            <option value="11">NOV</option><option value="12">DEZ</option>
        </select>
    </div>

    <div id="tab-cad" class="form-group">
        <input type="text" id="nome-compra" placeholder="Nome do item">
        <input type="number" id="valor-unit" placeholder="Valor Unitário R$" oninput="calcTotal()">
        <div class="input-row">
            <input type="number" id="qtd-compra" placeholder="Qtd" oninput="calcTotal()" style="flex: 2;">
            <select id="unidade-compra" style="flex: 1;">
                <option value="UN">UN</option>
                <option value="CX">CX</option>
                <option value="KG">KG</option>
                <option value="ML">ML</option>
                <option value="PC">PC</option>
                <option value="LT">LT</option>
            </select>
        </div>
        <p>Total: <strong id="total-preview">R$ 0,00</strong></p>
        <button onclick="addCompra()" class="btn-small bg-azul">CADASTRAR COMPRA</button>
    </div>

    <div id="lista-compras"></div>
    
    <!-- Indicador de sincronização -->
    <div id="sync-indicator" class="sync-status sync-pending">Sincronizando...</div>
</div>

<!-- Firebase SDK via CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        setDoc, 
        getDoc, 
        updateDoc, 
        arrayUnion, 
        arrayRemove,
        onSnapshot,
        enableIndexedDbPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
        getAuth,         createUserWithEmailAndPassword, 
        signInWithEmailAndPassword, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Configuração do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBxWPtsT6e6oCztD9JHZYMqvGd4CzzY5XA",
        authDomain: "lista-de-compras-13f60.firebaseapp.com",
        projectId: "lista-de-compras-13f60",
        storageBucket: "lista-de-compras-13f60.firebasestorage.app",
        messagingSenderId: "701417243300",
        appId: "1:701417243300:web:ac56526f1096c64aa3dc31"
    };
    
    // Inicializa Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Habilita persistência offline
    enableIndexedDbPersistence(db).catch((err) => {
        if (err.code === 'failed-precondition') {
            console.log('Múltiplas abas abertas - persistência offline desativada');
        } else if (err.code === 'unimplemented') {
            console.log('Navegador não suporta persistência offline');
        }
    });

    // Referências do documento no Firestore
    const comprasRef = doc(db, "apps", "minhas-compras-1-0");
    
    // Variáveis globais
    window.compras = [];
    window.saldosMensais = {};
    window.editIdx = null;
    window.db = db;
    window.auth = auth;

    // === FUNÇÕES DE AUTENTICAÇÃO ===
    
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.usuarioAtual = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('user-display').textContent = `👤 ${user.email}`;
            
            if (typeof window.syncFromFirebase === 'function') {                window.syncFromFirebase();
            }
            if (typeof window.init === 'function') {
                window.init();
            }
        } else {
            window.usuarioAtual = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('form-cadastro').classList.add('hidden');
            document.getElementById('form-login').classList.remove('hidden');
        }
    });

    window.criarConta = async function() {
        const nome = document.getElementById('cad-nome').value.trim();
        const email = document.getElementById('cad-email').value.trim();
        const senha = document.getElementById('cad-senha').value;
        const confirmar = document.getElementById('cad-confirmar').value;
        const errorDiv = document.getElementById('login-error');
        const btn = document.getElementById('btn-cadastro');

        if (!nome || !email || !senha || !confirmar) {
            errorDiv.textContent = '⚠ Preencha todos os campos!';
            errorDiv.style.display = 'block';
            return;
        }
        if (senha.length < 6) {
            errorDiv.textContent = '⚠ A senha deve ter pelo menos 6 caracteres!';
            errorDiv.style.display = 'block';
            return;
        }
        if (senha !== confirmar) {
            errorDiv.textContent = '⚠ As senhas não conferem!';
            errorDiv.style.display = 'block';
            return;
        }

        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading"></span> Criando...';
        btn.disabled = true;
        errorDiv.style.display = 'none';

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
            await updateDoc(doc(db, "users", userCredential.user.uid), {
                nome: nome,
                email: email,
                createdAt: new Date()
            }, { merge: true });            
            document.getElementById('cad-nome').value = '';
            document.getElementById('cad-email').value = '';
            document.getElementById('cad-senha').value = '';
            document.getElementById('cad-confirmar').value = '';            
        } catch (error) {
            console.error("Erro ao criar conta:", error);
            let mensagem = '⚠ Erro ao criar conta. ';
            if (error.code === 'auth/email-already-in-use') mensagem += 'E-mail já cadastrado!';
            else if (error.code === 'auth/invalid-email') mensagem += 'E-mail inválido!';
            else if (error.code === 'auth/weak-password') mensagem += 'Senha muito fraca!';
            else mensagem += 'Tente novamente.';
            errorDiv.textContent = mensagem;
            errorDiv.style.display = 'block';
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    };

    window.fazerLogin = async function() {
        const email = document.getElementById('login-email').value.trim();
        const senha = document.getElementById('login-senha').value;
        const errorDiv = document.getElementById('login-error');
        const btn = document.getElementById('btn-login');

        if (!email || !senha) {
            errorDiv.textContent = '⚠ Preencha e-mail e senha!';
            errorDiv.style.display = 'block';
            return;
        }

        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading"></span> Entrando...';
        btn.disabled = true;
        errorDiv.style.display = 'none';

        try {
            await signInWithEmailAndPassword(auth, email, senha);
        } catch (error) {
            console.error("Erro ao fazer login:", error);
            let mensagem = '⚠ Erro ao entrar. ';
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                mensagem += 'E-mail ou senha incorretos!';
            } else if (error.code === 'auth/invalid-email') {
                mensagem += 'E-mail inválido!';
            } else {
                mensagem += 'Tente novamente.';
            }
            errorDiv.textContent = mensagem;            errorDiv.style.display = 'block';
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    };

    window.fazerLogout = async function() {
        if (confirm('Deseja realmente sair da conta?')) {
            try {
                await signOut(auth);
                window.compras = [];
                window.saldosMensais = {};
            } catch (error) {
                console.error("Erro ao fazer logout:", error);
                alert('Erro ao sair. Tente novamente.');
            }
        }
    };

    window.alternarCadastro = function() {
        const formLogin = document.getElementById('form-login');
        const formCadastro = document.getElementById('form-cadastro');
        const errorDiv = document.getElementById('login-error');
        
        formLogin.classList.toggle('hidden');
        formCadastro.classList.toggle('hidden');
        errorDiv.style.display = 'none';
        
        document.getElementById('login-email').value = '';
        document.getElementById('login-senha').value = '';
        document.getElementById('cad-nome').value = '';
        document.getElementById('cad-email').value = '';
        document.getElementById('cad-senha').value = '';
        document.getElementById('cad-confirmar').value = '';
    };

    // === FUNÇÕES DE SINCRONIZAÇÃO COM FIREBASE ===
    
    function syncFromFirebase() {
        if (!auth.currentUser) return;
        
        const userComprasRef = doc(db, "users", auth.currentUser.uid, "compras", "lista");
        
        onSnapshot(userComprasRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                window.compras = data.compras || [];
                window.saldosMensais = data.saldosMensais || {};
                                if (typeof window.renderList === 'function') {
                    window.renderList();
                }
                updateSyncStatus('ok');
            } else {
                saveToFirebase();
            }
        }, (error) => {
            console.error("Erro ao sincronizar:", error);
            updateSyncStatus('error');
            loadFromLocalStorage();
        });
    }

    async function saveToFirebase() {
        if (!auth.currentUser) return;
        
        try {
            updateSyncStatus('pending');
            const userComprasRef = doc(db, "users", auth.currentUser.uid, "compras", "lista");
            
            await setDoc(userComprasRef, {
                compras: window.compras,
                saldosMensais: window.saldosMensais,
                updatedAt: new Date()
            }, { merge: true });
            updateSyncStatus('ok');
            saveToLocalStorage();
        } catch (error) {
            console.error("Erro ao salvar no Firebase:", error);
            updateSyncStatus('error');
            saveToLocalStorage();
        }
    }

    // === FALLBACK PARA LOCALSTORAGE ===
    
    function saveToLocalStorage() {
        try {
            if (auth.currentUser) {
                localStorage.setItem('compras_' + auth.currentUser.uid, JSON.stringify(window.compras));
                localStorage.setItem('saldosMensais_' + auth.currentUser.uid, JSON.stringify(window.saldosMensais));
            }
        } catch(e) {
            console.warn("Não foi possível salvar no localStorage");
        }
    }

    function loadFromLocalStorage() {
        try {            if (auth.currentUser) {
                const comprasLocal = localStorage.getItem('compras_' + auth.currentUser.uid);
                const saldosLocal = localStorage.getItem('saldosMensais_' + auth.currentUser.uid);
                if (comprasLocal) window.compras = JSON.parse(comprasLocal);
                if (saldosLocal) window.saldosMensais = JSON.parse(saldosLocal);
                if (typeof window.renderList === 'function') {
                    window.renderList();
                }
            }
        } catch(e) {
            console.warn("Não foi possível carregar do localStorage");
        }
    }

    // === UTILITÁRIOS DE UI ===
    
    function updateSyncStatus(status) {
        const indicator = document.getElementById('sync-indicator');
        if (!indicator) return;
        
        indicator.className = `sync-status sync-${status}`;
        const messages = {
            'ok': '✓ Sincronizado',
            'error': '⚠ Offline',
            'pending': '↻ Sincronizando...'
        };
        indicator.textContent = messages[status] || status;
        
        if (status === 'ok') {
            setTimeout(() => {
                if (indicator.classList.contains('sync-ok')) {
                    indicator.style.opacity = '0.3';
                }
            }, 3000);
        }
    }

    window.syncFromFirebase = syncFromFirebase;
    window.saveToFirebase = saveToFirebase;
    window.updateSyncStatus = updateSyncStatus;
</script>

<script>
    // === CÓDIGO ORIGINAL COM ADAPTAÇÕES MÍNIMAS ===
    
    let editIdx = null;

    // Funções da Calculadora
    let calcExpressao = "";
    function toggleCalc() {        const modal = document.getElementById('calc-modal');
        const overlay = document.getElementById('overlay');
        const isVisible = modal.style.display === 'block';
        modal.style.display = isVisible ? 'none' : 'block';
        overlay.style.display = isVisible ? 'none' : 'block';
    }

    function addCalc(val) {
        calcExpressao += val;
        document.getElementById('calc-display').innerText = calcExpressao;
    }

    function clearCalc() {
        calcExpressao = "";
        document.getElementById('calc-display').innerText = "0";
    }

    function execCalc() {
        try {
            calcExpressao = eval(calcExpressao).toString();
            document.getElementById('calc-display').innerText = calcExpressao;
        } catch {
            document.getElementById('calc-display').innerText = "Erro";
            calcExpressao = "";
        }
    }

    function init() {
        // ✅ REMOVIDO: checkLock() - bloqueio de 4 contas e senha ADM
        if (window.compras && window.compras.length > 0) {
            renderList();
        }
    }

    // ✅ FUNÇÃO checkLock REMOVIDA - sem limite de contas
    // ✅ FUNÇÃO unlockApp REMOVIDA - sem senha de administrador

    function calcTotal() {
        const v = parseFloat(document.getElementById('valor-unit').value) || 0;
        const q = parseFloat(document.getElementById('qtd-compra').value) || 0;
        document.getElementById('total-preview').innerText = `R$ ${(v * q).toFixed(2)}`;
    }

    function addCompra() {
        if (!window.auth || !window.auth.currentUser) {
            alert('Você precisa estar logado para cadastrar compras!');
            return;
        }
        
        const nome = document.getElementById('nome-compra').value;        const valor = parseFloat(document.getElementById('valor-unit').value);
        const qtd = parseFloat(document.getElementById('qtd-compra').value);
        const unidade = document.getElementById('unidade-compra').value;
        const mes = document.getElementById('filtro-mes').value;

        if(!nome || isNaN(valor) || isNaN(qtd)) return alert("Preencha os dados corretamente!");

        const novaCompra = {
            nome, valor, qtd, unidade, total: valor * qtd, 
            pago: false, mes: mes, id: Date.now()
        };

        if(editIdx !== null) {
            window.compras[editIdx] = novaCompra;
            editIdx = null;
        } else {
            window.compras.push(novaCompra);
        }

        saveData();
        clearForm();
        renderList();
        // ✅ REMOVIDO: checkLock() após adicionar compra
    }

    function pagarCompra(id) {
        if (!window.auth || !window.auth.currentUser) {
            alert('Você precisa estar logado para realizar esta ação!');
            return;
        }
        
        const idx = window.compras.findIndex(c => c.id === id);
        if (idx === -1) return;
        
        const mesAtual = window.compras[idx].mes;
        
        window.compras[idx].pago = true;        
        if(window.saldosMensais[mesAtual] !== undefined) {
            window.saldosMensais[mesAtual] -= window.compras[idx].total;
        }
        
        let proxMesNum = parseInt(mesAtual) + 1;
        let proxMes = proxMesNum > 12 ? "01" : proxMesNum.toString().padStart(2, '0');
        
        const recorrente = {...window.compras[idx], id: Date.now() + 1, pago: false, mes: proxMes};
        window.compras.push(recorrente);

        saveData();
        renderList();
    }
    function deletarCompra(id) {
        if (!window.auth || !window.auth.currentUser) {
            alert('Você precisa estar logado para realizar esta ação!');
            return;
        }
        
        window.compras = window.compras.filter(c => c.id !== id);
        saveData();
        renderList();
    }

    function editCompra(id) {
        if (!window.auth || !window.auth.currentUser) {
            alert('Você precisa estar logado para realizar esta ação!');
            return;
        }
        
        const item = window.compras.find(c => c.id === id);
        if (!item) return;
        
        document.getElementById('nome-compra').value = item.nome;
        document.getElementById('valor-unit').value = item.valor;
        document.getElementById('qtd-compra').value = item.qtd;
        document.getElementById('unidade-compra').value = item.unidade || 'UN';
        editIdx = window.compras.findIndex(c => c.id === id);
        calcTotal();
        window.scrollTo(0,0);
    }
    
    function salvarAlimentacao() {
        if (!window.auth || !window.auth.currentUser) {
            alert('Você precisa estar logado para realizar esta ação!');
            return;
        }
        
        const mes = document.getElementById('filtro-mes').value;
        const valor = parseFloat(document.getElementById('saldo-alim').value) || 0;
        
        window.saldosMensais[mes] = valor;
        
        document.getElementById('saldo-alim').disabled = true;
        document.getElementById('btn-fixar').style.display = 'none';
        document.getElementById('btn-editar-alim').style.display = 'block';
        
        saveData();
        renderList();
    }

    function editarAlimentacao() {        document.getElementById('saldo-alim').disabled = false;
        document.getElementById('btn-fixar').style.display = 'block';
        document.getElementById('btn-editar-alim').style.display = 'none';
    }

    function saveData() {
        if (window.saveToFirebase) {
            window.saveToFirebase();
        } else {
            localStorage.setItem('compras', JSON.stringify(window.compras));
            localStorage.setItem('saldosMensais', JSON.stringify(window.saldosMensais));
        }
    }

    function renderList(filtro = 'todos') {
        const lista = document.getElementById('lista-compras');
        const mesAtual = document.getElementById('filtro-mes').value;
        lista.innerHTML = "";

        const saldoDoMes = window.saldosMensais[mesAtual] || 0;
        document.getElementById('display-saldo').innerText = `R$ ${parseFloat(saldoDoMes).toFixed(2)}`;
        
        if(window.saldosMensais[mesAtual] !== undefined) {
            document.getElementById('saldo-alim').value = window.saldosMensais[mesAtual].toFixed(2);
            document.getElementById('saldo-alim').disabled = true;
            document.getElementById('btn-fixar').style.display = 'none';
            document.getElementById('btn-editar-alim').style.display = 'block';
        } else {
            document.getElementById('saldo-alim').value = "";
            document.getElementById('saldo-alim').disabled = false;
            document.getElementById('btn-fixar').style.display = 'block';
            document.getElementById('btn-editar-alim').style.display = 'none';
        }

        (window.compras || []).filter(c => c.mes === mesAtual).forEach(item => {
            if(filtro === 'pago' && !item.pago) return;
            if(filtro === 'n-pago' && item.pago) return;

            const div = document.createElement('div');
            div.className = `item-compra ${item.pago ? 'pago' : 'pendente'}`;
            div.innerHTML = `
                <strong>${item.nome}</strong><br>
                Qtd: ${item.qtd} ${item.unidade || 'UN'} | Total: R$ ${item.total.toFixed(2)} <br>
                Status: ${item.pago ? '<span style="color:green">PAGO</span>' : '<span style="color:red">NÃO PAGO</span>'}
                <div style="margin-top:10px; display:flex; gap:5px">
                    ${!item.pago ? `<button onclick="pagarCompra(${item.id})" class="btn-small bg-verde">PAGAR</button>` : ''}
                    <button onclick="editCompra(${item.id})" class="btn-small bg-lilas">EDITAR</button>
                    <button onclick="deletarCompra(${item.id})" class="btn-small bg-vermelho">EXCLUIR</button>
                </div>
            `;            lista.appendChild(div);
        });
    }

    function showTab(type) {
        if(type === 'pago') renderList('pago');
        else if(type === 'n-pago') renderList('n-pago');
        else renderList('todos');
    }

    function clearForm() {
        document.getElementById('nome-compra').value = "";
        document.getElementById('valor-unit').value = "";
        document.getElementById('qtd-compra').value = "";
        document.getElementById('unidade-compra').value = "UN";
        document.getElementById('total-preview').innerText = "R$ 0,00";
    }

    // Inicializa app via onAuthStateChanged
</script>

</body>
</html>
