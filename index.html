<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINHAS COMPRAS 1.0</title>
    <style>
        :root {
            --azul: #2196F3;
            --lilas: #9c27b0;
            --vermelho: #f44336;
            --verde: #4CAF50;
            --laranja: #ff9800;
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
        }

        .container { padding: 15px; max-width: 500px; margin: auto; position: relative; }

        h1 { text-align: center; font-size: 1.5rem; color: #00d2ff; margin-top: 40px; }

        /* Botão Calculadora Superior Direito */
        .btn-calc-topo {
            position: absolute;
            top: 10px;
            right: 15px;
            background: var(--laranja);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }

        /* Modal da Calculadora */
        #calc-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);            background: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 2000;
            width: 260px;
        }

        #calc-display {
            width: 100%;
            height: 50px;
            background: #000;
            color: #0f0;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            margin-bottom: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            border: 1px solid #444;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .btn-calc {
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        .btn-calc.op { background: var(--laranja); }
        .btn-calc.igual { background: var(--verde); grid-column: span 2; }
        .btn-calc.clear { background: var(--vermelho); grid-column: span 2; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1999;
        }
        /* Menu Superior */        .menu-topo {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 20px;
        }

        .btn-small {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Cores dos Botões */
        .bg-azul { background-color: var(--azul); }
        .bg-verde { background-color: var(--verde); }
        .bg-vermelho { background-color: var(--vermelho); }
        .bg-lilas { background-color: var(--lilas); }
        .bg-laranja { background-color: var(--laranja); }

        /* Card de Alimentação */
        .card-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Formulário */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .input-row {
            display: flex;
            gap: 5px;
        }
        input, select {
            padding: 12px;
            border-radius: 5px;
            border: none;
            background: #eee;
            color: #333;
        }

        /* Lista de Compras */
        .item-compra {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            position: relative;
        }

        .item-compra.pago { border-left: 8px solid var(--verde); }
        .item-compra.pendente { border-left: 8px solid var(--vermelho); }

        /* Bloqueio ADM */
        #block-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
        }

        .btn-wpp {
            background: #25d366;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 50px;
            margin-top: 20px;
            display: inline-block;
        }

        /* 🔐 NOVO: Estilos da Tela de Autenticação */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .auth-card h2 {
            text-align: center;
            color: #00d2ff;
            margin-bottom: 20px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .auth-form input::placeholder {
            color: #666;
        }

        .auth-btn {
            padding: 14px;
            border: none;            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .auth-btn:active { transform: scale(0.98); }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .auth-toggle a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-toggle a:hover { text-decoration: underline; }

        .auth-error {
            background: rgba(244, 67, 54, 0.2);
            color: #ffcdd2;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .auth-success {
            background: rgba(76, 175, 80, 0.2);
            color: #c8e6c9;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        /* Botão de Logout */
        #btn-logout {
            position: absolute;
            top: 10px;
            left: 15px;            background: var(--vermelho);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            font-size: 0.8rem;
            display: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 10px;
            color: #00d2ff;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

<!-- 🔐 TELA DE AUTENTICAÇÃO (NOVA) -->

    <div class="auth-card">
        <h2 id="auth-title">ENTRAR</h2>
        
        <div id="auth-error" class="auth-error"></div>

        <button class="btn-calc" onclick="addCalc('1')">1</button>

<div class="container">
    <!-- 🔐 Botão de Logout (NOVO) -->
    <button id="btn-logout" class="btn-small bg-vermelho" onclick="logoutUser()">🔓 SAIR</button>
    
    <button class="btn-calc-topo" onclick="toggleCalc()">🖩 CALCULADORA</button>
    <h1>MINHAS COMPRAS 1.0</h1>

    <div class="card-info">
        <label>Saldo Alimentação (Mês):</label>
        <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px;">
            <input type="number" id="saldo-alim" placeholder="R$ 0,00" style="flex:1; min-width: 100px;">
            <button onclick="salvarAlimentacao()" id="btn-fixar" class="btn-small bg-verde">FIXAR ALIMENTAÇÃO</button>
            <button onclick="editarAlimentacao()" id="btn-editar-alim" class="btn-small bg-laranja" style="display:none">EDITAR</button>

    <div id="lista-compras"></div>
</div>

<!-- Firebase SDKs via CDN (Compat mode) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // ============================================
    // CONFIGURAÇÃO DO FIREBASE
    // ⚠️ Em produção, use variáveis de ambiente ou Firebase Config
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyBWUQvPdMiCseatHN_Nh1B7_EjGUSyFlaE",
        authDomain: "lista-de-compras-533d3.firebaseapp.com",
        projectId: "lista-de-compras-533d3",
        storageBucket: "lista-de-compras-533d3.firebasestorage.app",
        messagingSenderId: "710244303874",
        appId: "1:710244303874:web:b5c99fa57bb8ba88ad131b"
    };
    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth(); // 🔐 Autenticação
    
    // Referência das coleções no Firestore (por usuário)
    const comprasRef = db.collection('compras');
    const saldosRef = db.collection('saldos');
    const configRef = db.collection('config');

    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    let compras = JSON.parse(localStorage.getItem('compras')) || [];
    let saldosMensais = JSON.parse(localStorage.getItem('saldosMensais')) || {};
    let editIdx = null;
    let appUnlocked = localStorage.getItem('appUnlocked') === 'true';
    
    // 🔐 Variáveis de Autenticação
    let currentUser = null;
    let isLoginMode = true;

    // ============================================
    // 🔐 FUNÇÕES DE AUTENTICAÇÃO (NOVAS)
    // ============================================
    
    // Alternar entre Login e Cadastro
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? 'ENTRAR' : 'CRIAR CONTA';
        document.getElementById('auth-submit').innerText = isLoginMode ? 'ENTRAR' : 'CADASTRAR';
        document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'Não tem conta?' : 'Já tem conta?';
        document.getElementById('auth-toggle-link').innerText = isLoginMode ? 'Criar conta' : 'Fazer login';
        document.getElementById('auth-name').style.display = isLoginMode ? 'none' : 'block';
        document.getElementById('auth-password').placeholder = isLoginMode ? 'Sua senha' : 'Senha (mín. 6 caracteres)';
        hideAuthMessages();
    }

    // Mostrar mensagens de autenticação
    function showAuthError(msg) {
        const el = document.getElementById('auth-error');
        el.innerText = msg;
        el.style.display = 'block';
        document.getElementById('auth-success').style.display = 'none';
    }

    function showAuthSuccess(msg) {
        const el = document.getElementById('auth-success');
        el.innerText = msg;        el.style.display = 'block';
        document.getElementById('auth-error').style.display = 'none';
    }

    function hideAuthMessages() {
        document.getElementById('auth-error').style.display = 'none';
        document.getElementById('auth-success').style.display = 'none';
    }

    function setLoadingAuth(loading) {
        document.getElementById('auth-loading').style.display = loading ? 'block' : 'none';
        document.getElementById('auth-submit').disabled = loading;
        document.getElementById('auth-email').disabled = loading;
        document.getElementById('auth-password').disabled = loading;
        document.getElementById('auth-name').disabled = loading;
    }

    // Login com e-mail e senha
    async function loginUser(email, password) {
        try {
            setLoadingAuth(true);
            hideAuthMessages();
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            return userCredential.user;
        } catch (error) {
            let msg = 'Erro ao entrar. Verifique seus dados.';
            if (error.code === 'auth/user-not-found') msg = 'Usuário não encontrado.';
            else if (error.code === 'auth/wrong-password') msg = 'Senha incorreta.';
            else if (error.code === 'auth/invalid-email') msg = 'E-mail inválido.';
            else if (error.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente mais tarde.';
            showAuthError(msg);
            throw error;
        } finally {
            setLoadingAuth(false);
        }
    }

    // Cadastro com e-mail e senha
    async function registerUser(email, password, name) {
        try {
            setLoadingAuth(true);
            hideAuthMessages();
            
            // Validação adicional no client-side (redundante com as Rules)
            if (!email || !email.includes('@')) throw new Error('E-mail inválido');
            if (password.length < 6) throw new Error('Senha muito curta');
            
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;
                        // Salvar nome do usuário no Firestore
            await db.collection('users').doc(user.uid).set({
                name: name || 'Usuário',
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            // Inicializar dados vazios para o novo usuário
            await db.collection('users').doc(user.uid).collection('config').doc('app').set({
                unlocked: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            showAuthSuccess('Conta criada com sucesso!');
            return user;
        } catch (error) {
            let msg = 'Erro ao criar conta.';
            if (error.code === 'auth/email-already-in-use') msg = 'Este e-mail já está em uso.';
            else if (error.code === 'auth/weak-password') msg = 'A senha deve ter pelo menos 6 caracteres.';
            else if (error.code === 'auth/invalid-email') msg = 'E-mail inválido.';
            showAuthError(msg);
            throw error;
        } finally {
            setLoadingAuth(false);
        }
    }

    // Logout
    async function logoutUser() {
        try {
            await auth.signOut();
            // Limpar dados locais do usuário anterior
            localStorage.removeItem('compras');
            localStorage.removeItem('saldosMensais');
            localStorage.removeItem('appUnlocked');
            
            // Resetar variáveis
            currentUser = null;
            compras = [];
            saldosMensais = {};
            appUnlocked = false;
            
            // Mostrar tela de auth e esconder app
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('btn-logout').style.display = 'none';
            document.querySelector('.container').style.display = 'none';
            document.getElementById('block-screen').style.display = 'none';
            
            // Resetar formulário de auth
            document.getElementById('auth-form').reset();            toggleAuthMode(); // Voltar para modo login
            isLoginMode = true;
            toggleAuthMode();
            hideAuthMessages();            
        } catch (error) {
            console.error('Erro ao sair:', error);
            alert('Erro ao sair. Tente novamente.');
        }
    }

    // Listener de estado de autenticação
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // Usuário logado
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'block';
            document.querySelector('.container').style.display = 'block';
            
            // Carregar dados do usuário
            await initUserData();
        } else {
            // Usuário deslogado
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('btn-logout').style.display = 'none';
            document.querySelector('.container').style.display = 'none';
            document.getElementById('block-screen').style.display = 'none';
        }
    });

    // Inicializar dados do usuário logado
    async function initUserData() {
        if (!currentUser) return;
        
        try {
            const userRef = db.collection('users').doc(currentUser.uid);
            
            // Carregar config (unlock) do usuário
            const configSnap = await userRef.collection('config').doc('app').get();
            if (configSnap.exists) {
                const configData = configSnap.data();
                if (configData.unlocked) {
                    appUnlocked = true;
                    localStorage.setItem('appUnlocked', 'true');
                }
            }
            
            // Carregar saldos do usuário
            const saldosSnap = await userRef.collection('saldos').doc('mensais').get();            if (saldosSnap.exists) {
                const saldosData = saldosSnap.data();
                if (saldosData.dados) {
                    saldosMensais = saldosData.dados;
                    localStorage.setItem('saldosMensais', JSON.stringify(saldosMensais));
                }
            }
            
            // Carregar compras do usuário
            const comprasSnap = await userRef.collection('compras').get();
            if (!comprasSnap.empty) {
                compras = [];
                comprasSnap.forEach(doc => {
                    const data = doc.data();
                    // Validação de segurança: só aceita dados com estrutura esperada
                    if (data.id && data.nome && typeof data.valor === 'number') {
                        compras.push({ id: parseInt(data.id), ...data });
                    }
                });
                localStorage.setItem('compras', JSON.stringify(compras));
            }
            
            console.log('✓ Dados do usuário carregados');
            checkLock();
            renderList();
            setupRealtimeSync(); // Ativar sync em tempo real para este usuário
            
        } catch (error) {
            console.warn('⚠ Usando dados locais:', error.message);
            checkLock();
            renderList();
        }
    }

    // ============================================
    // FUNÇÕES DE SINCRONIZAÇÃO COM FIREBASE
    // (Adaptadas para usar dados por usuário + validações)
    // ============================================
    
    // Sanitizar dados antes de enviar ao Firebase
    function sanitizeCompra(item) {
        return {
            id: Number(item.id) || Date.now(),
            nome: String(item.nome).substring(0, 100),
            valor: Math.min(Math.max(Number(item.valor) || 0, 0), 999999.99),
            qtd: Math.min(Math.max(Number(item.qtd) || 1, 1), 9999),
            unidade: String(item.unidade || 'UN').substring(0, 10),
            total: Math.min(Math.max(Number(item.total) || 0, 0), 9999999.99),
            pago: Boolean(item.pago),
            mes: String(item.mes || '01').match(/^\d{2}$/) ? item.mes : '01'        };
    }

    // Salvar dados no Firestore + localStorage (por usuário)
    async function saveData() {
        if (!currentUser) return; // Só salva se estiver logado
        
        // Mantém o localStorage (funcionalidade original)
        localStorage.setItem('compras', JSON.stringify(compras));
        localStorage.setItem('saldosMensais', JSON.stringify(saldosMensais));
        
        try {
            const userRef = db.collection('users').doc(currentUser.uid);
            
            // Salvar compras em lote (na subcoleção do usuário) com sanitização
            const batch = db.batch();
            compras.forEach(item => {
                const docRef = userRef.collection('compras').doc(item.id.toString());
                batch.set(docRef, sanitizeCompra(item), { merge: true });
            });
            await batch.commit();
            
            // Salvar saldos mensais (na subcoleção do usuário)
            await userRef.collection('saldos').doc('mensais').set({ 
                dados: saldosMensais, 
                atualizado: firebase.firestore.FieldValue.serverTimestamp() 
            }, { merge: true });
            
            // Salvar status de desbloqueio (na subcoleção do usuário)
            await userRef.collection('config').doc('app').set({ 
                unlocked: appUnlocked, 
                atualizado: firebase.firestore.FieldValue.serverTimestamp() 
            }, { merge: true });
            
            console.log('✓ Dados sincronizados com Firebase');
        } catch (error) {
            console.warn('⚠ Erro ao sincronizar com Firebase (funcionando offline):', error.message);
            // Continua funcionando com localStorage em caso de falha
        }
    }

    // Listener em tempo real para atualizações do Firebase (por usuário)
    function setupRealtimeSync() {
        if (!currentUser) return;
        
        const userRef = db.collection('users').doc(currentUser.uid);
        
        // Ouvir mudanças em saldos
        userRef.collection('saldos').doc('mensais').onSnapshot((doc) => {
            if (doc.exists && doc.data().dados) {                // Validação básica dos dados recebidos
                const dados = doc.data().dados;
                if (typeof dados === 'object' && dados !== null) {
                    saldosMensais = dados;
                    localStorage.setItem('saldosMensais', JSON.stringify(saldosMensais));
                    renderList();
                }
            }
        }, (error) => {
            console.warn('⚠ Erro no listener de saldos:', error.message);
        });
        
        // Ouvir mudanças em compras
        userRef.collection('compras').onSnapshot((snapshot) => {
            const novasCompras = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                // Validação de segurança: filtra dados malformados
                if (data.id && data.nome && typeof data.valor === 'number') {
                    novasCompras.push({ id: parseInt(data.id), ...data });
                }
            });
            if (JSON.stringify(novasCompras) !== JSON.stringify(compras)) {
                compras = novasCompras;
                localStorage.setItem('compras', JSON.stringify(compras));
                renderList();
                checkLock();
            }
        }, (error) => {
            console.warn('⚠ Erro no listener de compras:', error.message);
        });
    }

    // ============================================
    // FUNÇÕES ORIGINAIS (mantidas 100% iguais)
    // ============================================
    // Funções da Calculadora
    let calcExpressao = "";
    function toggleCalc() {
        const modal = document.getElementById('calc-modal');
        const overlay = document.getElementById('overlay');
        const isVisible = modal.style.display === 'block';
        modal.style.display = isVisible ? 'none' : 'block';
        overlay.style.display = isVisible ? 'none' : 'block';
    }

    function addCalc(val) {
        calcExpressao += val;
        document.getElementById('calc-display').innerText = calcExpressao;
    }
    function clearCalc() {
        calcExpressao = "";
        document.getElementById('calc-display').innerText = "0";
    }

    function execCalc() {
        try {
            // Sanitização básica para evitar injeção via eval
            if (!/^[0-9+\-*/.\s()]+$/.test(calcExpressao)) {
                throw new Error('Expressão inválida');
            }
            calcExpressao = eval(calcExpressao).toString();
            document.getElementById('calc-display').innerText = calcExpressao;
        } catch {
            document.getElementById('calc-display').innerText = "Erro";
            calcExpressao = "";
        }
    }

    function init() {
        // A autenticação agora controla o carregamento via onAuthStateChanged
        // init() é chamado, mas os dados só carregam após login
        console.log('App inicializado - aguardando autenticação...');
    }

    function checkLock() {
        if (compras.length >= 4 && !appUnlocked) {
            document.getElementById('block-screen').style.display = 'flex';
        }
    }

    function unlockApp() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === 'itv2026001') {
            appUnlocked = true;
            localStorage.setItem('appUnlocked', 'true');
            saveData(); // Salva status no Firebase também
            document.getElementById('block-screen').style.display = 'none';
        } else {
            alert("Senha incorreta!");
        }
    }

    function calcTotal() {
        const v = parseFloat(document.getElementById('valor-unit').value) || 0;
        const q = parseFloat(document.getElementById('qtd-compra').value) || 0;
        document.getElementById('total-preview').innerText = `R$ ${(v * q).toFixed(2)}`;
    }
    function addCompra() {
        const nome = document.getElementById('nome-compra').value;
        const valor = parseFloat(document.getElementById('valor-unit').value);
        const qtd = parseFloat(document.getElementById('qtd-compra').value);
        const unidade = document.getElementById('unidade-compra').value;
        const mes = document.getElementById('filtro-mes').value;

        if(!nome || isNaN(valor) || isNaN(qtd)) return alert("Preencha os dados corretamente!");

        const novaCompra = {
            nome, valor, qtd, unidade, total: valor * qtd, 
            pago: false, mes: mes, id: Date.now()
        };

        if(editIdx !== null) {
            compras[editIdx] = novaCompra;
            editIdx = null;
        } else {
            compras.push(novaCompra);
        }

        saveData(); // Salva no localStorage + Firebase
        clearForm();
        renderList();
        checkLock();
    }

    function pagarCompra(id) {
        const idx = compras.findIndex(c => c.id === id);
        if (idx === -1) return;
        
        const mesAtual = compras[idx].mes;
        
        compras[idx].pago = true;
        
        if(saldosMensais[mesAtual] !== undefined) {
            saldosMensais[mesAtual] -= compras[idx].total;
        }
        
        let proxMesNum = parseInt(mesAtual) + 1;
        let proxMes = proxMesNum > 12 ? "01" : proxMesNum.toString().padStart(2, '0');        
        const recorrente = {...compras[idx], id: Date.now() + 1, pago: false, mes: proxMes};
        compras.push(recorrente);

        saveData(); // Salva no localStorage + Firebase
        renderList();
    }

    function deletarCompra(id) {
        compras = compras.filter(c => c.id !== id);        saveData(); // Salva no localStorage + Firebase
        renderList();
    }

    function editCompra(id) {
        const item = compras.find(c => c.id === id);
        if (!item) return;
        
        document.getElementById('nome-compra').value = item.nome;
        document.getElementById('valor-unit').value = item.valor;
        document.getElementById('qtd-compra').value = item.qtd;
        document.getElementById('unidade-compra').value = item.unidade || 'UN';
        editIdx = compras.findIndex(c => c.id === id);
        calcTotal();
        window.scrollTo(0,0);
    }

    function salvarAlimentacao() {
        const mes = document.getElementById('filtro-mes').value;
        const valor = parseFloat(document.getElementById('saldo-alim').value) || 0;
        
        // Validação de segurança no client-side
        if (valor < 0 || valor > 999999.99) {
            return alert("Valor de saldo inválido!");
        }
        
        saldosMensais[mes] = valor;
        
        document.getElementById('saldo-alim').disabled = true;
        document.getElementById('btn-fixar').style.display = 'none';
        document.getElementById('btn-editar-alim').style.display = 'block';
        
        saveData(); // Salva no localStorage + Firebase
        renderList();
    }

    function editarAlimentacao() {
        document.getElementById('saldo-alim').disabled = false;
        document.getElementById('btn-fixar').style.display = 'block';
        document.getElementById('btn-editar-alim').style.display = 'none';
    }

    function renderList(filtro = 'todos') {
        const lista = document.getElementById('lista-compras');
        const mesAtual = document.getElementById('filtro-mes').value;
        lista.innerHTML = "";

        const saldoDoMes = saldosMensais[mesAtual] || 0;
        document.getElementById('display-saldo').innerText = `R$ ${parseFloat(saldoDoMes).toFixed(2)}`;
                if(saldosMensais[mesAtual] !== undefined) {
            document.getElementById('saldo-alim').value = saldosMensais[mesAtual].toFixed(2);
            document.getElementById('saldo-alim').disabled = true;
            document.getElementById('btn-fixar').style.display = 'none';
            document.getElementById('btn-editar-alim').style.display = 'block';
        } else {
            document.getElementById('saldo-alim').value = "";
            document.getElementById('saldo-alim').disabled = false;
            document.getElementById('btn-fixar').style.display = 'block';
            document.getElementById('btn-editar-alim').style.display = 'none';
        }

        compras.filter(c => c.mes === mesAtual).forEach(item => {
            if(filtro === 'pago' && !item.pago) return;
            if(filtro === 'n-pago' && item.pago) return;

            const div = document.createElement('div');
            div.className = `item-compra ${item.pago ? 'pago' : 'pendente'}`;
            div.innerHTML = `
                <strong>${item.nome}</strong><br>
                Qtd: ${item.qtd} ${item.unidade || 'UN'} | Total: R$ ${item.total.toFixed(2)} <br>
                Status: ${item.pago ? '<span style="color:green">PAGO</span>' : '<span style="color:red">NÃO PAGO</span>'}
                <div style="margin-top:10px; display:flex; gap:5px">
                    ${!item.pago ? `<button onclick="pagarCompra(${item.id})" class="btn-small bg-verde">PAGAR</button>` : ''}
                    <button onclick="editCompra(${item.id})" class="btn-small bg-lilas">EDITAR</button>
                    <button onclick="deletarCompra(${item.id})" class="btn-small bg-vermelho">EXCLUIR</button>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    function showTab(type) {
        if(type === 'pago') renderList('pago');
        else if(type === 'n-pago') renderList('n-pago');
        else renderList('todos');
    }

    function clearForm() {
        document.getElementById('nome-compra').value = "";
        document.getElementById('valor-unit').value = "";
        document.getElementById('qtd-compra').value = "";
        document.getElementById('unidade-compra').value = "UN";
        document.getElementById('total-preview').innerText = "R$ 0,00";
    }

    // ============================================
    // EVENT LISTENER DO FORMULÁRIO DE AUTH
    // ============================================
    document.getElementById('auth-form').addEventListener('submit', async (e) => {        e.preventDefault();
        
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const name = document.getElementById('auth-name').value.trim();
        
        try {
            if (isLoginMode) {
                await loginUser(email, password);
            } else {
                await registerUser(email, password, name);
                // Após cadastro, fazer login automático
                await loginUser(email, password);
            }
        } catch (error) {
            // Erro já tratado nas funções
            console.error('Auth error:', error);
        }
    });

    // ============================================
    // PROTEÇÃO CONTRA XSS E INJEÇÃO
    // Sanitização de inputs ao renderizar
    // ============================================
    function escapeHtml(text) {
        const map = {
            '&': '&',
            '<': '<',
            '>': '>',
            '"': '"',
            "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    // Inicializa o app
    init();
</script>

<!--

1. REGRAS FIRESTORE (deploy separado):
   - Usuários só acessam seus próprios dados (users/{uid}/...)
   - Validação rigorosa de estrutura de dados nas rules
   - Bloqueio total de coleções raiz não utilizadas
   - Sem restrições de tempo conforme solicitado

2. CLIENT-SIDE (neste código):
   - Sanitização de dados antes de enviar ao Firebase   - Validação de tipos e limites numéricos
   - Proteção contra XSS com escapeHtml()
   - Sanitização da expressão da calculadora
   - Tratamento de erros em listeners em tempo real
   - Fallback para localStorage em caso de falha de rede

3. AUTENTICAÇÃO:
   - Firebase Auth com email/senha
   - Dados isolados por usuário no Firestore
   - Logout limpa dados locais do usuário anterior

- A segurança real depende das Rules, não apenas do client-side
